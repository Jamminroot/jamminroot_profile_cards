  <text x="572" y="178" fill="#656d76" font-size="10" text-anchor="end">Jamminroot/jamminroot_profile_cards</text>
  <text x="114" y="194" fill="#656d76" font-size="11">Built a TypeScript pipeline that pulls GitHub data via GraphQL</text>
