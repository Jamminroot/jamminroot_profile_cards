  <g transform="translate(24, 24)"><text class="fg" x="0" y="14" font-size="16" font-weight="700">Recent activity</text>
<text class="muted" x="600" y="14" font-size="10" text-anchor="end">updated 2026-05-09</text>
<text class="muted" x="0" y="32" font-size="12">Built and maintained a Telegram integration node for n8n, shipped a</text>
<text class="muted" x="0" y="50" font-size="12">cross-platform file-tagging utility to the Microsoft Store, and</text>
<text class="muted" x="0" y="68" font-size="12">bootstrapped an Android chat app with an ASP.NET Core backend featuring</text>
<text class="muted" x="0" y="86" font-size="12">tool-call</text>
<text class="accent" x="0" y="134" font-size="11" font-weight="600">2026 Feb–Mar</text>
<circle class="accent" cx="70" cy="130" r="4"/>
<text class="fg" x="86" y="154" font-size="13" font-weight="600">Bootstrapped Ozwil Android app and backend</text>
<text class="muted" x="600" y="154" font-size="10" text-anchor="end">Jamminroot/ozwil-api</text>
<text class="muted" x="86" y="170" font-size="11">Initialized a new Android app with an ASP.NET Core backend,</text>
<text class="muted" x="86" y="186" font-size="11">adding tool-call safety rails, a MarkdownText composable, and</text>
<text class="muted" x="86" y="202" font-size="11">chat UI cleanup.</text>
<text class="fg" x="86" y="230" font-size="13" font-weight="600">Stabilized n8n TelePilot node CI/CD</text>
<text class="muted" x="600" y="230" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="246" font-size="11">Resolved npm registry errors and auth race conditions in CI,</text>
<text class="muted" x="86" y="262" font-size="11">upgraded test infrastructure to n8n 2.8.3, and added a new album</text>
<text class="muted" x="86" y="278" font-size="11">trigger.</text>
<line class="border" x1="70" y1="134" x2="70" y2="290" stroke-width="1"/>
<text class="accent" x="0" y="318" font-size="11" font-weight="600">2026 Jan</text>
<circle class="accent" cx="70" cy="314" r="4"/>
<text class="fg" x="86" y="338" font-size="13" font-weight="600">Released Intag v2.0 on Microsoft Store</text>
<text class="muted" x="600" y="338" font-size="10" text-anchor="end">Jamminroot/intag</text>
<text class="muted" x="86" y="354" font-size="11">Shipped version 2.0 of the Windows file-tagging utility with</text>
<text class="muted" x="86" y="370" font-size="11">support for additional metadata properties and a Microsoft Store</text>
<text class="muted" x="86" y="386" font-size="11">listing.</text>
<text class="fg" x="86" y="414" font-size="13" font-weight="600">Fixed TDLib session persistence in n8n node</text>
<text class="muted" x="600" y="414" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="430" font-size="11">Moved TDLib session storage to a stable path outside</text>
<text class="muted" x="86" y="446" font-size="11">node_modules to prevent data loss across updates.</text>
<line class="border" x1="70" y1="318" x2="70" y2="458" stroke-width="1"/>
<text class="accent" x="0" y="486" font-size="11" font-weight="600">2025 Aug–Sep</text>
<circle class="accent" cx="70" cy="482" r="4"/>
<text class="fg" x="86" y="506" font-size="13" font-weight="600">Added Docker deployment support for n8n TelePil…</text>
<text class="muted" x="600" y="506" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="522" font-size="11">Created Debian-based and Alpine Linux Docker configurations for</text>
<text class="muted" x="86" y="538" font-size="11">deploying n8n with the TelePilot2 node.</text>
<line class="border" x1="70" y1="486" x2="70" y2="550" stroke-width="1"/></g>
