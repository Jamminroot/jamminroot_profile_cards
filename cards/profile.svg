  <rect class="bg" x="0" y="0" width="952" height="1060" rx="8" ry="8"/>
  <g transform="translate(24, 24)"><text class="fg" x="0" y="14" font-size="16" font-weight="700">Recent activity</text>
<text class="muted" x="600" y="14" font-size="10" text-anchor="end">updated 2026-05-09</text>
<text class="muted" x="0" y="32" font-size="12">Recent work spans Telegram automation tooling, an Android + ASP.NET LLM</text>
<text class="muted" x="0" y="50" font-size="12">chat backend, Windows productivity tools shipped to the Microsoft Store,</text>
<text class="muted" x="0" y="68" font-size="12">and personal infrastructure — dotfiles, profile-card generators, and a</text>
<text class="muted" x="0" y="86" font-size="12">YOLO</text>
<text class="accent" x="0" y="134" font-size="11" font-weight="600">2026 Apr–May</text>
<circle class="accent" cx="70" cy="130" r="4"/>
<text class="fg" x="86" y="154" font-size="13" font-weight="600">Custom GitHub profile cards generator</text>
<text class="muted" x="600" y="154" font-size="10" text-anchor="end">Jamminroot/jamminroot_profile_cards</text>
<text class="muted" x="86" y="170" font-size="11">Built a TypeScript pipeline that pulls GitHub data via GraphQL</text>
<text class="muted" x="86" y="186" font-size="11">and renders custom SVG sidebar cards plus an LLM-summarised CV</text>
<text class="muted" x="86" y="202" font-size="11">timeline, replacing a third-party action.</text>
<text class="fg" x="86" y="230" font-size="13" font-weight="600">Clash.Meta API re-exposure</text>
<text class="muted" x="600" y="230" font-size="10" text-anchor="end">Jamminroot/Clash.Meta</text>
<text class="muted" x="86" y="246" font-size="11">Re-exposed `ProxiesWithProviders` and `GetProxyNameList` APIs in</text>
<text class="muted" x="86" y="262" font-size="11">the Mihomo fork to keep FlClash integration working.</text>
<line class="border" x1="70" y1="134" x2="70" y2="274" stroke-width="1"/>
<text class="accent" x="0" y="302" font-size="11" font-weight="600">2026 Mar</text>
<circle class="accent" cx="70" cy="298" r="4"/>
<text class="fg" x="86" y="322" font-size="13" font-weight="600">Ozwil chat assistant — initial cut</text>
<text class="muted" x="600" y="322" font-size="10" text-anchor="end">Jamminroot/ozwil-api</text>
<text class="muted" x="86" y="338" font-size="11">Spun up an Android app + ASP.NET Core backend for an LLM-powered</text>
<text class="muted" x="86" y="354" font-size="11">chat assistant. Initial scaffolding plus tool-call safety rails,</text>
<text class="muted" x="86" y="370" font-size="11">a Markdown rendering composable, Docker healthcheck setup, and</text>
<text class="muted" x="86" y="386" font-size="11">chat</text>
<line class="border" x1="70" y1="302" x2="70" y2="398" stroke-width="1"/>
<text class="accent" x="0" y="426" font-size="11" font-weight="600">2026 Feb</text>
<circle class="accent" cx="70" cy="422" r="4"/>
<text class="fg" x="86" y="446" font-size="13" font-weight="600">telepilot-2 v0.8.2 release push</text>
<text class="muted" x="600" y="446" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="462" font-size="11">Shipped a new &#39;album&#39; trigger, fixed an auth race condition on</text>
<text class="muted" x="86" y="478" font-size="11">existing sessions, and modernised CI: bumped n8n test version</text>
<text class="muted" x="86" y="494" font-size="11">1.89 → 2.8.3, added npm 403 retry logic, and cleaned up stale</text>
<text class="muted" x="86" y="510" font-size="11">registry</text>
<text class="fg" x="86" y="538" font-size="13" font-weight="600">intag v2 on Microsoft Store</text>
<text class="muted" x="600" y="538" font-size="10" text-anchor="end">Jamminroot/intag</text>
<text class="muted" x="86" y="554" font-size="11">Polished the Windows Explorer file-tagging tool through to a</text>
<text class="muted" x="86" y="570" font-size="11">v2.4.29 release: added support for additional metadata</text>
<text class="muted" x="86" y="586" font-size="11">properties (#26), shipped a privacy policy, and refreshed</text>
<text class="muted" x="86" y="602" font-size="11">README/store</text>
<text class="fg" x="86" y="630" font-size="13" font-weight="600">YOLO labeler — built in a day</text>
<text class="muted" x="600" y="630" font-size="10" text-anchor="end">Jamminroot/yolo-labeler</text>
<text class="muted" x="86" y="646" font-size="11">Built a small on-host YOLO image labeling tool from scratch in a</text>
<text class="muted" x="86" y="662" font-size="11">single day. Multi-select mark mode, batch delete, Ctrl+Delete</text>
<text class="muted" x="86" y="678" font-size="11">shortcuts, flexible YAML resolution.</text>
<text class="fg" x="86" y="706" font-size="13" font-weight="600">Neovim IDE config</text>
<text class="muted" x="600" y="706" font-size="10" text-anchor="end">Jamminroot/.dotfiles</text>
<text class="muted" x="86" y="722" font-size="11">Stood up a personal Neovim setup: migrated to the 0.11+</text>
<text class="muted" x="86" y="738" font-size="11">`vim.lsp.config` API, updated treesitter, added OSC 52 clipboard</text>
<text class="muted" x="86" y="754" font-size="11">for SSH sessions, wired up a pre-commit secret-detection hook.</text>
<line class="border" x1="70" y1="426" x2="70" y2="766" stroke-width="1"/>
<text class="accent" x="0" y="794" font-size="11" font-weight="600">2026 Jan</text>
<circle class="accent" cx="70" cy="790" r="4"/>
<text class="fg" x="86" y="814" font-size="13" font-weight="600">telepilot-2 stability work</text>
<text class="muted" x="600" y="814" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="830" font-size="11">Hardened the TDLib integration: moved session storage to a</text>
<text class="muted" x="86" y="846" font-size="11">stable path outside `node_modules`, restored the required</text>
<text class="muted" x="86" y="862" font-size="11">`apiId/apiHash` parameters to `tdl.createClient()`, version</text>
<text class="muted" x="86" y="878" font-size="11">bumps</text>
<line class="border" x1="70" y1="794" x2="70" y2="890" stroke-width="1"/>
<text class="accent" x="0" y="918" font-size="11" font-weight="600">Late 2025</text>
<circle class="accent" cx="70" cy="914" r="4"/>
<text class="fg" x="86" y="938" font-size="13" font-weight="600">telepilot-2 fork foundation</text>
<text class="muted" x="600" y="938" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="954" font-size="11">Forked telepilotco/n8n-nodes-telepilot and stood it up as a</text>
<text class="muted" x="86" y="970" font-size="11">maintained package: Debian + Alpine Docker images, README/docs</text>
<text class="muted" x="86" y="986" font-size="11">for TelePilot2, initial auth fix work.</text>
<line class="border" x1="70" y1="918" x2="70" y2="998" stroke-width="1"/></g>
