  <rect class="bg" x="0" y="0" width="952" height="612" rx="8" ry="8"/>
  <g transform="translate(24, 24)"><text class="fg" x="0" y="14" font-size="16" font-weight="700">Recent activity</text>
<text class="muted" x="600" y="14" font-size="10" text-anchor="end">updated 2026-05-18</text>
<text class="muted" x="0" y="32" font-size="12">Heavy focus on automating a personal GitHub profile CV generator with</text>
<text class="muted" x="0" y="50" font-size="12">heatmaps, timeline charts, and LLM-driven summaries. Also maintained a</text>
<text class="muted" x="0" y="68" font-size="12">forked n8n Telegram node with auth fixes, CI hardening, and a new album</text>
<text class="muted" x="0" y="86" font-size="12">trigger.</text>
<text class="accent" x="0" y="134" font-size="11" font-weight="600">2026 May</text>
<circle class="accent" cx="70" cy="130" r="4"/>
<text class="fg" x="86" y="154" font-size="13" font-weight="600">Profile CV generator with charts and LLM summar…</text>
<text class="muted" x="600" y="154" font-size="10" text-anchor="end">Jamminroot/Jamminroot</text>
<text class="muted" x="86" y="170" font-size="11">Built a pipeline that generates a CV timeline, heatmap, and</text>
<text class="muted" x="86" y="186" font-size="11">project cards from GitHub activity, using LLM summarisation with</text>
<text class="muted" x="86" y="202" font-size="11">mandatory repo coverage and configurable weights.</text>
<text class="fg" x="86" y="230" font-size="13" font-weight="600">Heatmap and timeline visual refinements</text>
<text class="muted" x="600" y="230" font-size="10" text-anchor="end">Jamminroot/Jamminroot</text>
<text class="muted" x="86" y="246" font-size="11">Added Catmull-Rom smoothed pulse charts, empty-week panel slots,</text>
<text class="muted" x="86" y="262" font-size="11">multi-identity author matching, and restructured the README with</text>
<text class="muted" x="86" y="278" font-size="11">sidebar cards.</text>
<line class="border" x1="70" y1="134" x2="70" y2="290" stroke-width="1"/>
<text class="accent" x="0" y="318" font-size="11" font-weight="600">2026 Feb</text>
<circle class="accent" cx="70" cy="314" r="4"/>
<text class="fg" x="86" y="338" font-size="13" font-weight="600">CI hardening and auth race-condition fixes</text>
<text class="muted" x="600" y="338" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="354" font-size="11">Resolved auth state race conditions, fixed npm 403 errors with</text>
<text class="muted" x="86" y="370" font-size="11">retry logic, upgraded CI to n8n 2.8.3, and moved TDLib session</text>
<text class="muted" x="86" y="386" font-size="11">storage to a stable path.</text>
<text class="fg" x="86" y="414" font-size="13" font-weight="600">New album trigger for Telegram node</text>
<text class="muted" x="600" y="414" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="430" font-size="11">Added an album trigger to the n8n Telegram node and updated</text>
<text class="muted" x="86" y="446" font-size="11">publish workflows for the forked package name.</text>
<line class="border" x1="70" y1="318" x2="70" y2="458" stroke-width="1"/>
<text class="accent" x="0" y="486" font-size="11" font-weight="600">2025 Aug–Sep</text>
<circle class="accent" cx="70" cy="482" r="4"/>
<text class="fg" x="86" y="506" font-size="13" font-weight="600">Docker deployment and auth work on TelePilot2</text>
<text class="muted" x="600" y="506" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="522" font-size="11">Added Debian and Alpine Docker deployment support for n8n with</text>
<text class="muted" x="86" y="538" font-size="11">TelePilot2, and started work on auth fixes.</text>
<line class="border" x1="70" y1="486" x2="70" y2="550" stroke-width="1"/></g>
