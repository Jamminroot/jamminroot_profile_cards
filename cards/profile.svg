<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 734" width="952" height="734" role="img" aria-label="Jamminroot profile card">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  .bg { fill: #ffffff; }
  .panel { fill: #f6f8fa; }
  .border { stroke: #d0d7de; }
  .fg { fill: #1f2328; }
  .muted { fill: #656d76; }
  .accent { fill: #0969da; }
  .accent2 { fill: #1f883d; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .panel { fill: #161b22; }
    .border { stroke: #30363d; }
    .fg { fill: #e6edf3; }
    .muted { fill: #7d8590; }
    .accent { fill: #58a6ff; }
    .accent2 { fill: #3fb950; }
  }
</style>
  <rect class="bg" x="0" y="0" width="952" height="734" rx="8" ry="8"/>
  <g transform="translate(24, 24)"><text class="fg" x="0" y="14" font-size="16" font-weight="700">Recent activity</text>
<text class="muted" x="600" y="14" font-size="10" text-anchor="end">updated 2026-06-01</text>
<text class="muted" x="0" y="32" font-size="12">Built an automated CV/portfolio pipeline driven by GitHub activity, and</text>
<text class="muted" x="0" y="50" font-size="12">maintained a custom n8n node for Telegram automation, fixing auth races</text>
<text class="muted" x="0" y="68" font-size="12">and CI stability.</text>
<text class="accent" x="0" y="116" font-size="11" font-weight="600">2026 May</text>
<circle class="accent" cx="70" cy="112" r="4"/>
<text class="fg" x="86" y="136" font-size="13" font-weight="600">CV profile pipeline with heatmap and timeline</text>
<text class="muted" x="600" y="136" font-size="10" text-anchor="end">Jamminroot/Jamminroot</text>
<text class="muted" x="86" y="152" font-size="11">Developed an automated SVG/markdown CV pipeline that generates</text>
<text class="muted" x="86" y="168" font-size="11">activity heatmaps, timeline blockquotes, and project cards from</text>
<text class="muted" x="86" y="184" font-size="11">GitHub commits, including a PDF with a hidden AI-scanner prompt.</text>
<text class="fg" x="86" y="212" font-size="13" font-weight="600">Repo weighting, filtering, and LLM integration</text>
<text class="muted" x="600" y="212" font-size="10" text-anchor="end">Jamminroot/Jamminroot</text>
<text class="muted" x="86" y="228" font-size="11">Added REPO_WEIGHTS config for importance weighting,</text>
<text class="muted" x="86" y="244" font-size="11">EXCLUDED_REPOS_REGEX filtering, private repo discovery, and LLM</text>
<text class="muted" x="86" y="260" font-size="11">payload injection to enforce coverage of top repos in generated</text>
<text class="muted" x="86" y="276" font-size="11">CV</text>
<line class="border" x1="70" y1="116" x2="70" y2="288" stroke-width="1"/>
<text class="accent" x="0" y="316" font-size="11" font-weight="600">2026 Feb</text>
<circle class="accent" cx="70" cy="312" r="4"/>
<text class="fg" x="86" y="336" font-size="13" font-weight="600">CI fixes for n8n 2.x compatibility</text>
<text class="muted" x="600" y="336" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="352" font-size="11">Upgraded CI test environment from n8n 1.89.0 to 2.8.3, added</text>
<text class="muted" x="86" y="368" font-size="11">retry logic for transient npm 403 errors, and removed stale npm</text>
<text class="muted" x="86" y="384" font-size="11">and Verdaccio registry configs.</text>
<text class="fg" x="86" y="412" font-size="13" font-weight="600">Auth race condition and session fixes</text>
<text class="muted" x="600" y="412" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="428" font-size="11">Fixed auth race condition causing unexpected authorization</text>
<text class="muted" x="86" y="444" font-size="11">states, improved session progression handling, and moved TDLib</text>
<text class="muted" x="86" y="460" font-size="11">storage to a stable path outside node_modules.</text>
<line class="border" x1="70" y1="316" x2="70" y2="472" stroke-width="1"/>
<text class="accent" x="0" y="500" font-size="11" font-weight="600">2026 Jan</text>
<circle class="accent" cx="70" cy="496" r="4"/>
<text class="fg" x="86" y="520" font-size="13" font-weight="600">New album trigger for TelePilot2</text>
<text class="muted" x="600" y="520" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="536" font-size="11">Added a new &#39;album&#39; trigger to the TelePilot2 n8n node and</text>
<text class="muted" x="86" y="552" font-size="11">restored required apiId/apiHash params for tdl.createClient().</text>
<line class="border" x1="70" y1="500" x2="70" y2="564" stroke-width="1"/>
<text class="accent" x="0" y="592" font-size="11" font-weight="600">2025 Sep</text>
<circle class="accent" cx="70" cy="588" r="4"/>
<text class="fg" x="86" y="612" font-size="13" font-weight="600">Docker deployment for n8n with TelePilot2</text>
<text class="muted" x="600" y="612" font-size="10" text-anchor="end">Jamminroot/n8n-nodes-telepilot-2</text>
<text class="muted" x="86" y="628" font-size="11">Added Debian-based and Alpine Linux Docker deployment support</text>
<text class="muted" x="86" y="644" font-size="11">for n8n with the TelePilot2 node, along with updated</text>
<text class="muted" x="86" y="660" font-size="11">documentation.</text>
<line class="border" x1="70" y1="592" x2="70" y2="672" stroke-width="1"/></g>
